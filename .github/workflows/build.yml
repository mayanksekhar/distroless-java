name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: zulu
            major: '25'
            full: 25.0.5.1
            release: zulu25.38.201-ca-jre25.0.5.1
            sha_amd64: 12277af4957cd249dc7aa50017ddde967a826fa48971b2411752fefe48e5ca8b
            sha_arm64: 164c7293bc17dcd21e56f84778cacfe57501a66c7ad3265b7f9f36c4cd9ec1e0
    env:
      IMAGE: ghcr.io/mayanksekhar/distroless-java/${{ matrix.vendor }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scan:local
          build-args: |
            ZULU=${{ matrix.release }}
            SHA_AMD64=${{ matrix.sha_amd64 }}
            SHA_ARM64=${{ matrix.sha_arm64 }}
      - name: Smoke test
        run: docker run --rm scan:local -version
      - name: Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.major }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.full }},enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and push multi arch
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZULU=${{ matrix.release }}
            SHA_AMD64=${{ matrix.sha_amd64 }}
            SHA_ARM64=${{ matrix.sha_arm64 }}
      - name: Smoke test arm64 from the registry
        if: github.event_name != 'pull_request'
        run: docker run --rm --platform linux/arm64 "${IMAGE}@${{ steps.push.outputs.digest }}" -version
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Sign image digest
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
