name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
env:
  IMAGE: ghcr.io/mayanksekhar/zulu-distroless
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scan:local
      - name: Smoke test
        run: docker run --rm scan:local -version
      - name: Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=25,enable={{is_default_branch}}
            type=raw,value=25.0.5.1,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and push multi arch
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Sign image digest
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
